site_name: XBArray
site_description: Cross-backend array library on the Array API Standard (NumPy, PyTorch, JAX)
site_url: https://unienvorg.github.io/XBArray/
repo_url: https://github.com/UniEnvOrg/XBArray
repo_name: UniEnvOrg/XBArray

exclude_docs: |
  gen_ref_pages.py

theme:
  name: material
  # Shared UniEnv docs theme from github.com/UniEnvOrg/UniEnvOrg.github.io (docs-theme/).
  # CI checks it out here; locally run scripts/fetch_docs_theme.sh first.
  custom_dir: .org-site/docs-theme
  logo: unienv/logo.svg
  favicon: unienv/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.tabs
    - navigation.footer
    - navigation.tracking
    - navigation.instant
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.annotate
    - content.code.copy
    - search.highlight
    - search.suggest

extra_css:
  - unienv/unienv.css

extra:
  unienv:
    current: XBArray
  version:
    provider: mike
    default: latest
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/UniEnvOrg

plugins:
  - search
  - gen-files:
      scripts:
        - docs/gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - section-index
  - mkdocstrings:
      handlers:
        python:
          paths:
            - .
          options:
            filters:
              - "!^_"
            heading_level: 2
            inherited_members: true
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_if_no_docstring: true
            show_root_full_path: false
            show_root_heading: false
            show_signature_annotations: true
            show_source: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            signature_crossrefs: true
            line_length: 88
            summary: true
            docstring_section_style: table

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
